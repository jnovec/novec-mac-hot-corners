name: Build and Release macOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate standalone installer
        shell: bash
        run: bash -n scripts/install.command

      - name: Compile both Mac architectures and run tests
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          mkdir -p build/arm64 build/x86_64
          xcrun swiftc -O -sdk "$SDK" -target arm64-apple-macos13.0 Sources/*.swift -o build/arm64/novec-hot-corners
          xcrun swiftc -O -sdk "$SDK" -target x86_64-apple-macos13.0 Sources/*.swift -o build/x86_64/novec-hot-corners
          build/x86_64/novec-hot-corners --self-test
          xcrun lipo -create build/arm64/novec-hot-corners build/x86_64/novec-hot-corners -output build/novec-hot-corners
          xcrun lipo -info build/novec-hot-corners
          for arch in arm64 x86_64; do
            xcrun lipo -archs build/novec-hot-corners | tr ' ' '\n' | grep -qx "$arch"
          done

      - name: Assemble and ad-hoc sign macOS app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/NOVEC Hot Corners.app"
          mkdir -p "$APP/Contents/MacOS"
          cp build/novec-hot-corners "$APP/Contents/MacOS/novec-hot-corners"
          chmod +x "$APP/Contents/MacOS/novec-hot-corners"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>online.novec.hotcorners</string>
          <key>CFBundleName</key><string>NOVEC Hot Corners</string>
          <key>CFBundleDisplayName</key><string>NOVEC Hot Corners</string>
          <key>CFBundleExecutable</key><string>novec-hot-corners</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>2</string>
          <key>CFBundleShortVersionString</key><string>0.2.0</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          <key>NSAppleEventsUsageDescription</key><string>NOVEC Hot Corners opens Terminal to run only the commands you configure.</string>
          <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/novec-hot-corners" --self-test

      - name: Package standalone install ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="ci-$GITHUB_RUN_NUMBER"
          fi
          BASENAME="NOVEC-Hot-Corners-$VERSION-macOS-universal"
          PKG="release/$BASENAME"
          mkdir -p "$PKG"
          ditto "build/NOVEC Hot Corners.app" "$PKG/NOVEC Hot Corners.app"
          cp scripts/install.command "$PKG/install.command"
          chmod +x "$PKG/install.command"
          cp README-FIRST.txt "$PKG/README-FIRST.txt"
          ditto -c -k --sequesterRsrc --keepParent "$PKG" "release/$BASENAME.zip"
          (cd release && shasum -a 256 "$BASENAME.zip" > "$BASENAME.zip.sha256")
          ls -lh release

      - name: Save downloadable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVEC-Hot-Corners-macOS-universal
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Publish stable release assets for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "NOVEC Mac Hot Corners $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --clobber
          gh release view "$GITHUB_REF_NAME" --json url,assets
